name: Privacy check

# Fails if any tracked file contains a personal Windows user path or a term
# from the PRIVACY_DENYLIST secret (one term per line, case-insensitive).
# Matches are reported by file and line only, so denylisted terms never
# appear in the log.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          fail=0

          # Personal user paths. In docs, write %USERPROFILE% or ~ instead.
          if git grep -n -I -E '[A-Za-z]:[\/]Users[\/]|/[cC]/Users/' > "$RUNNER_TEMP/hits"; then
            echo "::error::Personal user path found at:"
            cut -d: -f1,2 "$RUNNER_TEMP/hits"
            fail=1
          fi

          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/deny"
            if git grep -n -I -i -F -f "$RUNNER_TEMP/deny" > "$RUNNER_TEMP/hits"; then
              echo "::error::Denylisted term found at (term not shown):"
              cut -d: -f1,2 "$RUNNER_TEMP/hits"
              fail=1
            fi
          else
            # Secrets aren't passed to pull requests from forks.
            echo "::warning::PRIVACY_DENYLIST is not available; only the path check ran."
          fi

          exit $fail
