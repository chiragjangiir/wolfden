name: Privacy check

# Fails if any tracked file contains a personal Windows user path or a term
# from the PRIVACY_DENYLIST secret (one term per line, case-insensitive;
# blank lines and lines starting with # are ignored).
# Matches are reported by file and line only, so denylisted terms never
# appear in the log.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan tracked files
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          fail=0
          # git grep exits 0 on a match, 1 on none, and >1 on an error.
          scan() { # $1 = label; remaining args = git grep options
            label=$1; shift
            # Steps run under bash -e, so capture the status instead of exiting.
            rc=0
            git grep -n -I "$@" > "$RUNNER_TEMP/hits" || rc=$?
            case $rc in
              0) echo "::error::$label at:"; cut -d: -f1,2 "$RUNNER_TEMP/hits"; fail=1 ;;
              1) ;;
              *) echo "::error::$label scan failed."; fail=1 ;;
            esac
          }

          # Personal user paths. Keep in sync with .githooks/privacy-lib.sh.
          # In docs, write %USERPROFILE% or ~ instead.
          scan "Personal user path found" -E -e '[A-Za-z]:[\/]Users[\/]|/[cC]/Users/'

          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" \
              | sed -e "1s/^$(printf '\357\273\277')//" -e 's/^[[:space:]]*//' \
                    -e 's/[[:space:]]*$//' -e '/^#/d' -e '/^$/d' \
              > "$RUNNER_TEMP/deny"
            if [ -s "$RUNNER_TEMP/deny" ]; then
              scan "Denylisted term found (term not shown)" -i -F -f "$RUNNER_TEMP/deny"
            else
              echo "::warning::PRIVACY_DENYLIST has no terms; only the path check ran."
            fi
          else
            # Secrets aren't passed to pull requests from forks.
            echo "::warning::PRIVACY_DENYLIST is not available; only the path check ran."
          fi

          exit $fail
